# Cấu hình mosquitto cho 3d_manage (chỉ dùng khi chạy broker qua docker-compose).
# Listener MQTT chuẩn cho thiết bị ESP (trạm cân)
listener 1883
protocol mqtt

# Listener websocket cho web app (next.config.ts rewrite /mqtt → 9001)
listener 9001
protocol websockets

# Mạng LAN cá nhân — cho phép kết nối không cần tài khoản
allow_anonymous true
