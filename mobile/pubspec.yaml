name: manage3d
description: App di động quản lý xưởng in 3D (client của backend 3D Manage).
publish_to: "none"
version: 1.0.0+1

environment:
  # Color.withValues() cần Flutter 3.27+ (thay withOpacity đã deprecated).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Cần cho locale vi_VN của Material (nếu thiếu, đặt locale 'vi' sẽ crash).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Lưu cấu hình (base URL, offset cân...)
  shared_preferences: ^2.3.3

  # CSDL cục bộ: bản sao dữ liệu đọc + hàng đợi thao tác khi mất mạng.
  # Dùng sqflite (SQL viết tay) chứ không phải drift — drift cần build_runner,
  # trái với nguyên tắc "không code generation" của dự án (xem README §5).
  sqflite: ^2.4.1
  path: ^1.9.0

  # Sinh uuid cho mỗi thao tác trong hàng đợi — đây là khóa chống gửi trùng,
  # bắt buộc phải sinh ở máy chứ không phải server cấp.
  uuid: ^4.5.1

  # Biết máy đang có mạng hay không để quyết định lúc nào đẩy hàng đợi.
  connectivity_plus: ^6.1.0

  # Quét QR / Barcode bằng camera (ML Kit)
  mobile_scanner: ^5.2.3

  # Hiển thị mã QR của hàng hóa / cuộn nhựa
  qr_flutter: ^4.1.0

  # Sinh file PDF (tờ QR số lỗi 1..30) và mở hộp thoại in / lưu / chia sẻ của máy.
  # Tờ này in bằng máy in giấy thường, không phải máy tem TSPL của xưởng.
  pdf: ^3.11.1
  printing: ^5.13.4

  # Sinh mã vạch Code 128 để vẽ lên tem "in tự do" (bản web tự encode bằng tay
  # trong print-label-tab.tsx; app dùng thư viện cho khỏi chép lại bảng ký tự).
  barcode: ^2.2.9

  # Trạm cân MQTT over WebSocket
  mqtt_client: ^10.6.0

  # Đọc số khi cân (assets/audio/*.mp3 lấy từ public/audio của bản web)
  audioplayers: ^6.1.0

  # Thông báo đẩy về hoạt động máy in.
  # firebase_core + firebase_messaging: nhận push kể cả khi app đã tắt hẳn — đây là lý do duy nhất
  # dùng Firebase, mọi thứ khác vẫn nói chuyện thẳng với máy chủ xưởng.
  # Cần đặt android/app/google-services.json (và ios/Runner/GoogleService-Info.plist) lấy từ
  # Firebase Console; thiếu file thì app vẫn chạy bình thường, chỉ không có push.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Android không tự hiện thông báo khi app đang mở, phải tự dựng.
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
