name: manage3d
description: App di động quản lý xưởng in 3D (client của backend 3D Manage).
publish_to: "none"
version: 1.0.0+1

environment:
  # Color.withValues() cần Flutter 3.27+ (thay withOpacity đã deprecated).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Cần cho locale vi_VN của Material (nếu thiếu, đặt locale 'vi' sẽ crash).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Lưu cấu hình (base URL, offset cân...)
  shared_preferences: ^2.3.3

  # Quét QR / Barcode bằng camera (ML Kit)
  mobile_scanner: ^5.2.3

  # Hiển thị mã QR của hàng hóa / cuộn nhựa
  qr_flutter: ^4.1.0

  # Trạm cân MQTT over WebSocket
  mqtt_client: ^10.6.0

  # Đọc số khi cân (assets/audio/*.mp3 lấy từ public/audio của bản web)
  audioplayers: ^6.1.0

  # Định dạng tiền VND / số
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
