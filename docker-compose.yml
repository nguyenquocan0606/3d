version: '3.8'

# LƯU Ý: App còn cần 1 MQTT broker có websocket listener trên cổng 9001
# (next.config.ts rewrite /mqtt → 127.0.0.1:9001 cho trạm cân ESP).
# Trên máy hiện tại broker là mosquitto chạy bằng systemd (KHÔNG nằm trong compose này).
# Nếu dựng máy mới không có mosquitto, bỏ comment service dưới đây:
#
#  mosquitto:
#    image: eclipse-mosquitto:2
#    ports:
#      - "127.0.0.1:9001:9001"
#      - "127.0.0.1:1883:1883"
#    volumes:
#      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
#    restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    container_name: 3d_manage_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: filament_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Worker Zalo: giữ phiên đăng nhập của các tài khoản Zalo và đẩy tin nhắn vào Postgres.
  # Chạy nền độc lập với console — đóng terminal hay logout đều không ảnh hưởng.
  zalo-worker:
    build:
      context: .
      dockerfile: Dockerfile.zalo-worker
    container_name: 3d_manage_zalo_worker
    depends_on:
      - postgres
    environment:
      # Trong mạng của compose, Postgres có tên là `postgres` — KHÁC với DATABASE_URL ở .env
      # (cái đó trỏ localhost, dành cho app Next chạy trên máy chủ).
      DATABASE_URL: postgresql://postgres:mysecretpassword@postgres:5432/filament_db?schema=public
      ZALO_WORKER_TOKEN: ${ZALO_WORKER_TOKEN}
      ZALO_ATTACHMENT_DIR: /app/data/zalo-attachments
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Chỉ mở ra 127.0.0.1 của máy chủ: app Next gọi vào được, ngoài mạng LAN thì không.
      - "127.0.0.1:39200:39200"
    volumes:
      # Bind mount (không phải named volume) vì app Next chạy NGOÀI Docker cũng phải đọc được
      # đúng những file này để phục vụ route /api/zalo/attachments.
      - ./data/zalo-attachments:/app/data/zalo-attachments
    restart: unless-stopped

  # Worker Slicer: chạy OrcaSlicer headless (bản 2 tab Báo giá) — xem scripts/slicer-worker.mjs.
  # KHÔNG có DATABASE_URL/quyền truy cập Postgres: container này chạy 1 binary xử lý file khách tải
  # lên, cô lập khỏi mọi thứ khác trong hệ thống — chỉ nhận job qua HTTP và tự gọi ngược
  # (`callbackUrl` do Next chỉ định trong từng job) để báo kết quả.
  slicer-worker:
    build:
      context: .
      dockerfile: Dockerfile.slicer-worker
    container_name: 3d_manage_slicer_worker
    environment:
      SLICER_WORKER_TOKEN: ${SLICER_WORKER_TOKEN}
    ports:
      - "127.0.0.1:39300:39300"
    volumes:
      # Bind mount (không phải named volume): app Next chạy NGOÀI Docker phải ghi được file vào
      # đây, worker trong Docker chỉ cần ĐỌC lại đúng file đó.
      - ./data/quote-uploads:/app/data/quote-uploads:ro
    # Cho worker gọi ngược về Next chạy trên máy chủ (NGOÀI Docker, xem comment Dockerfile.zalo-worker)
    # qua tên `host.docker.internal` — mặc định Docker Engine trên Linux không có sẵn tên này như
    # Docker Desktop, phải khai rõ bằng extra_hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
